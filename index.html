<!DOCTYPE html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // First visit to a French page with no stored choice and a non-French browser:
      // offer English. Client-side only, never for bots. Slugs mirror src/data/site.ts.
      (function () {
        var map = { '/': '/en', '/underlaid': '/en/underlaid', '/govllm': '/en/govllm', '/parcours': '/en/path', '/interventions': '/en/talks', '/engagements': '/en/commitments' }
        var p = location.pathname.replace(/\/+$/, '') || '/'
        if (!(p in map)) return
        if (/bot|crawl|spider|slurp|lighthouse|headless|preview|facebookexternalhit|embed|whatsapp|telegram|discord|linkedin/i.test(navigator.userAgent)) return
        var stored = null
        try { stored = localStorage.getItem('lang') } catch (e) {}
        var lang = (navigator.language || '').toLowerCase()
        if (stored === 'en' || (!stored && lang && lang.indexOf('fr') !== 0)) location.replace(map[p] + location.search + location.hash)
      })()
    </script>
    <script>
      // Set the theme before first paint: stored choice, else the OS preference, else dark.
      (function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="author" content="Jehanne Dussert" />

    <!-- Microsoft Clarity, loaded once the page is idle -->
    <script>
      window.addEventListener('load', function () {
        var go = function () {
          (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) }
            t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y)
          })(window, document, 'clarity', 'script', 'w05kvlfc64')
        }
        'requestIdleCallback' in window ? requestIdleCallback(go, { timeout: 4000 }) : setTimeout(go, 2000)
      })
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
